<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Readout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- Header Navigasi -->
        <header class="app-header">
            <div>
                <a href="https://portofolio-08do.netlify.app" class="back-link" rel="noopener noreferrer">← Portofolio</a>
                <h1 class="app-title">Prakiraan Cuaca</h1>
            </div>
            <span class="app-date" id="currentDate"></span>
        </header>

        <!-- Form Pencarian & Geolocation -->
        <form id="searchForm" class="search-form" role="search">
            <div class="search-input-wrapper">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Cari nama kota..."
                    autocomplete="off"
                    aria-label="Nama kota"
                    required
                >
                <button type="submit" id="searchBtn" aria-label="Cari cuaca">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                </button>
            </div>
        </form>

        <!-- Quick Cities & Location Button -->
        <div class="actions-bar">
            <button type="button" id="geoBtn" class="action-btn geo-btn" title="Gunakan lokasi perangkat saat ini">
                📍 Lokasi Saya
            </button>
            <div class="quick-cities">
                <button type="button" class="city-chip" data-city="Jakarta">Jakarta</button>
                <button type="button" class="city-chip" data-city="Bandung">Bandung</button>
                <button type="button" class="city-chip" data-city="Surabaya">Surabaya</button>
                <button type="button" class="city-chip" data-city="Tokyo">Tokyo</button>
            </div>
        </div>

        <!-- Unit Toggle (°C / °F) -->
        <div class="unit-toggle-bar">
            <span class="unit-label">Satuan Suhu:</span>
            <button type="button" id="unitCelsius" class="unit-btn active">°C</button>
            <span class="unit-divider">|</span>
            <button type="button" id="unitFahrenheit" class="unit-btn">°F</button>
        </div>

        <!-- Dynamic Weather Area (Live Region for Accessibility) -->
        <div id="weatherResult" class="result" aria-live="polite">
            <!-- Initial state diset lewat JavaScript (default Jakarta / Geolocation) -->
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
