<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
<a href="https://portofolio-08do.netlify.app" style="font-size:0.8rem; color:#888; text-decoration:none; display:inline-block; margin-bottom:16px;">← Back to Portfolio</a>
        <!-- Header -->
        <header class="app-header">
            <span class="app-title">Weather</span>
            <span class="app-date" id="currentDate"></span>
        </header>

        <!-- Search -->
        <div class="search">
            <input
                type="text"
                id="cityInput"
                placeholder="Cari kota..."
                autocomplete="off"
            >
            <button id="searchBtn" aria-label="Cari cuaca">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
        </div>

        <!-- Result -->
        <div id="weatherResult" class="result">
            <p class="result-empty">Ketik nama kota untuk mulai</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
